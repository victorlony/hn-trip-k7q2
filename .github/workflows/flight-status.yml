name: Flight status
on:
  schedule:
    # Only around the return flight CI792 (11/3, 06:00-17:50 Taiwan time)
    - cron: "*/10 22-23 2 11 *"
    - cron: "*/10 0-9 3 11 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/flight_status.py flight.json
      - run: |
          git diff --quiet -- flight.json && git ls-files --error-unmatch flight.json >/dev/null 2>&1 && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add flight.json
          git commit -m "Update flight status"
          git push
