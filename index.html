<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9B63B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="河內行程">
<link rel="manifest" href="manifest.webmanifest">

<title>河內・下龍灣・寧平 旅遊行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#FFFFFF; --ink:#1B2A26; --muted:#5C6B66; --line:#E3E6E1; --soft:#F3F6F2;
  --ochre:#E9B63B; --ochre-ink:#2E2206; --shutter:#1F5A4C; --shutter-2:#2C7563;
  --rain:#2F6F98; --danger:#B03A2E; --field:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1D19; --ink:#ECEAE2; --muted:#A3B1AC; --line:#26403A;
    --soft:#152A25; --ochre:#D7A42C; --ochre-ink:#1C1503; --shutter:#78C2AC; --shutter-2:#5AA892;
    --rain:#86BEDF; --danger:#F08A7E; --field:#10231E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1D19; --ink:#ECEAE2; --muted:#A3B1AC; --line:#26403A;
  --soft:#152A25; --ochre:#D7A42C; --ochre-ink:#1C1503; --shutter:#78C2AC; --shutter-2:#5AA892;
  --rain:#86BEDF; --danger:#F08A7E; --field:#10231E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rain);outline-offset:2px;border-radius:4px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}

/* Hero: Hanoi ochre wall with green shutters */
.hero{background:var(--ochre);color:var(--ochre-ink);position:relative;overflow:hidden}
.hero .wrap{position:relative;padding-top:44px;padding-bottom:36px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero h1{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:clamp(34px,8vw,60px);line-height:1.12;margin:0;letter-spacing:.02em}
.hero .sub{font-size:18px;font-weight:700;margin:12px 0 0}
.hero .flights{font-size:14px;margin:10px 0 0;max-width:46ch;opacity:.85}
.shutters{display:flex;gap:6px;height:150px;align-self:stretch;min-height:120px}
.shutter{width:44px;border-radius:22px 22px 3px 3px;background:repeating-linear-gradient(180deg,var(--shutter) 0 7px,var(--shutter-2) 7px 9px);box-shadow:inset 0 0 0 3px var(--shutter)}
@media (max-width:560px){.hero .wrap{grid-template-columns:1fr}.shutters{display:none}}

/* Day nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.nav a b{font-variant-numeric:tabular-nums}
.nav a:hover{border-color:var(--shutter)}

/* Day */
.day{padding:36px 0 8px;border-bottom:1px solid var(--line)}
.day-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.dbadge{background:var(--shutter);color:var(--bg);border-radius:10px;padding:8px 10px;text-align:center;min-width:68px}
.dbadge .n{display:block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.dbadge .w{font-size:13px}
.day h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:26px;line-height:1.3;margin:0}
.sum{margin:6px 0 0;color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:14px}
.fact{display:flex;align-items:center;gap:6px}
.temp{font-weight:700;font-variant-numeric:tabular-nums}
.rainbar{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle}
.rainbar i{display:block;height:100%;background:var(--rain)}
.wear{color:var(--muted)}

/* Timeline */
.tl{list-style:none;margin:22px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:16px;position:relative;padding-bottom:18px}
.tl li::before{content:"";position:absolute;left:87px;top:10px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:83px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--shutter)}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;text-align:right;padding-top:1px;white-space:nowrap}
.body{padding-left:16px;min-width:0}
.body h3{font-size:17px;font-weight:700;margin:0;line-height:1.5}
.note{margin:2px 0 0;color:var(--muted);font-size:14px}
.maps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.map{display:inline-flex;align-items:center;gap:5px;font-size:13px;text-decoration:none;padding:3px 10px 3px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.map:hover{border-color:var(--shutter)}
.map svg{width:13px;height:13px;flex:none;color:var(--shutter)}

/* Packing + tips */
.block{padding:36px 0 8px}
.block h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:26px;margin:0}
.progress{color:var(--muted);font-size:14px;margin:4px 0 0}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:16px}
.group h3{font-size:15px;margin:0 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:4px;accent-color:var(--shutter);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.tips{margin:14px 0 0;padding-left:20px}
.tips li{margin:6px 0;max-width:62ch}
footer{padding:28px 0 120px;color:var(--muted);font-size:13px}

/* Toolbar */
.bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--shutter);color:var(--bg);box-shadow:0 4px 14px rgba(20,50,40,.25)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;margin-top:16px}

/* Edit mode */
.ed input,.ed textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.ed input:focus,.ed textarea:focus{border-color:var(--shutter);outline:none}
.ed textarea{resize:vertical;min-height:40px}
.ed .row{display:grid;gap:6px;margin-top:6px}
.ed .r2{grid-template-columns:1fr 1fr}
.ed .r4{grid-template-columns:repeat(4,1fr)}
.ed label{font-size:12px;color:var(--muted);display:block}
.ed .item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--soft)}
.ed .item-top{display:grid;grid-template-columns:90px 1fr;gap:6px}
.ed .maprow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-top:6px}
.ed .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:13px}
.mini.del{color:var(--danger)}
.ed .h-in{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px}
.ed .chk{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:6px}
@media (max-width:560px){.ed .r4{grid-template-columns:1fr 1fr}.tl li{grid-template-columns:62px 1fr}.tl li::before{left:73px}.tl li::after{left:69px}.day-head{grid-template-columns:1fr}.dbadge{justify-self:start;display:flex;gap:8px;align-items:baseline}}
@media print{.bar,.nav,.toast{display:none}}
/* Flights */
.fl{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg)}
.fl-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fl-no{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:900}
.fl-route{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:8px;font-variant-numeric:tabular-nums}
.fl-route b{display:block;font-size:22px}
.fl-route small{color:var(--muted);font-size:13px}
.fl-route .line{border-top:2px dashed var(--line);position:relative}
.fl-route .line::after{content:"✈";position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:var(--bg);padding:0 4px}
.fl-note{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:700;color:var(--danger)}
.fl-live{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.fl-live b{font-size:18px}
.fl-live s{color:var(--muted)}
.fl-st{font-weight:700;padding:2px 10px;border-radius:999px;background:var(--shutter);color:var(--bg)}
.fl-st.bad{background:var(--danger)}
.fl-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fl-links a{font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--shutter);color:var(--shutter);text-decoration:none;font-weight:500}
.fl-links a:hover{background:var(--shutter);color:var(--bg)}
.fl-foot{font-size:12px;color:var(--muted);margin:8px 0 0}

/* Weather card */
.wx{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,var(--soft),var(--bg) 70%)}
.wx-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wx-ic svg{width:54px;height:54px;display:block}
.wx-place{font-size:14px;color:var(--muted);font-weight:500}
.wx-t{font-family:"Noto Serif TC",serif;font-size:32px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.wx-t small{font-family:"Noto Sans TC",sans-serif;font-size:16px;color:var(--muted);font-weight:500}
.wx-chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.rain b{color:var(--rain)}
.wx-hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);text-align:center;font-size:12px}
.wx-hours div{display:flex;flex-direction:column;align-items:center;gap:1px}
.wx-hours svg{width:26px;height:26px}
.wx-hours b{font-size:14px;font-variant-numeric:tabular-nums}
.wx-hours span{color:var(--muted)}
.wx-hours .p{color:var(--rain)}
.wx-wear{font-size:14px;margin:10px 0 0}
.wx-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
@media (max-width:560px){.wx-chips{margin-left:0;width:100%}}
/* Today + next stop */
.day.today .dbadge{background:var(--ochre);color:var(--ochre-ink)}
.today-tag{display:inline-block;margin-left:8px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--ochre);color:var(--ochre-ink);vertical-align:middle}
.tl li.next::after{background:var(--ochre);border-color:var(--ochre)}
.next-tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--ochre-ink);background:var(--ochre);border-radius:999px;padding:1px 8px;vertical-align:middle}
/* Phones */
a.tel{color:var(--shutter);font-weight:700;text-decoration:underline}
.sos-g{font-size:15px;margin:18px 0 0}
.sos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:8px}
.call{display:flex;align-items:flex-start;gap:12px;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.call:hover{border-color:var(--shutter)}
.call .ph{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--shutter);color:var(--bg)}
.call .ph svg{width:18px;height:18px}
.call .nm{display:block;font-size:14px;font-weight:500}
.call .num{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--shutter)}
.call small{display:block;font-size:13px;color:var(--muted)}
.call.urgent{border-color:var(--danger)}
.call.urgent .ph{background:var(--danger)}
.call.urgent .num{color:var(--danger)}
.btn.sos-btn{background:var(--danger);color:var(--bg);text-decoration:none}
/* Currency */
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:14px;max-width:560px}
.fx label{font-size:13px;color:var(--muted)}
.fx input{display:block;margin-top:4px;font:inherit;font-size:20px;font-weight:700;width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
.fx input:focus{border-color:var(--shutter);outline:none}
.fx-eq{font-size:22px;font-weight:700;padding-bottom:10px}
.fx-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
</style>
</head>

<script id="sheet-lib">
window.TripSheet=(function(){
function parseCSV(s){
  var rows=[],row=[],f='',q=false,i,c;
  for(i=0;i<s.length;i++){
    c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function objects(rows){
  var head=(rows[0]||[]).map(function(x){return x.trim()});
  return rows.slice(1).map(function(r){var o={};head.forEach(function(k,i){o[k]=(r[i]||'').trim()});return o});
}
function fromSheet(t,fallback){
  var info={};t['基本資料'].forEach(function(r){info[r['欄位']]=r['內容']});
  var days=t['每天'].filter(function(r){return r['日期']}).map(function(r,i){
    return {id:'d'+(i+1),date:r['日期'],dow:r['星期'],title:r['主題'],summary:r['摘要'],stay:r['住宿'],stayQ:r['住宿連結'],
      weather:{place:r['天氣地點'],hi:r['高溫'],lo:r['低溫'],rain:r['降雨%'],wear:r['穿著']},items:[]};
  });
  var by={};days.forEach(function(d){by[d.date]=d});
  t['行程'].forEach(function(r){
    var d=by[r['日期']];if(!d||!(r['行程']||r['時間']))return;
    var maps=[];[1,2].forEach(function(k){if(r['地圖'+k])maps.push({l:r['地圖'+k+'名稱'],q:r['地圖'+k]})});
    d.items.push({t:r['時間'],title:r['行程'],note:r['備註'],maps:maps});
  });
  var groups=[],gi={};
  t['準備清單'].forEach(function(r){
    if(!r['項目'])return;var g=r['分類']||'其他';
    if(!(g in gi)){gi[g]=groups.length;groups.push({group:g,items:[]})}
    groups[gi[g]].items.push({text:r['項目'],done:/^(true|是|v|x|✓|✔)$/i.test(r['已準備'])});
  });
  return {title:info['標題']||fallback.title,subtitle:info['日期']||'',flights:info['班機與時差']||'',flightNote:info['航班狀態']||'',updated:Date.now(),
    days:days,packing:groups,tips:t['小提醒'].map(function(r){return r['內容']}).filter(Boolean)};
}
var TABS=['基本資料','每天','行程','準備清單','小提醒'];
function load(id,fallback){
  return Promise.all(TABS.map(function(name){
    return fetch('https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(name),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(name+' '+r.status);return r.text()})
      .then(function(s){return objects(parseCSV(s))});
  })).then(function(all){var t={};TABS.forEach(function(n,i){t[n]=all[i]});return fromSheet(t,fallback)})
    .then(function(s){return phones(id).then(function(p){if(p.length)s.phones=p;return s})});
}
// Optional "電話" tab. A missing tab makes gviz return the first tab, so check the headers.
function phones(id){
  return fetch('https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent('電話'),{cache:'no-store'})
    .then(function(r){return r.ok?r.text():''}).then(function(s){
      var rows=objects(parseCSV(s));
      if(!rows.length||!('電話' in rows[0])||!('名稱' in rows[0]))return [];
      return rows.filter(function(r){return r['電話']}).map(function(r){
        return {g:r['分類']||'其他',n:r['名稱'],p:r['電話'],d:r['說明']||'',u:/^(true|是|v|x|✓|✔)$/i.test(r['緊急']||'')};
      });
    }).catch(function(){return []});
}
return {parseCSV:parseCSV,objects:objects,fromSheet:fromSheet,load:load};
})();
</script>

try{var lv=JSON.parse(localStorage.getItem(LIVE)||'null');if(lv&&lv.wx)live=lv}catch(e){}
function saveLive(){try{localStorage.setItem(LIVE,JSON.stringify(live))}catch(e){}}

var PLACES=[{k:'下龍',lat:20.9101,lon:107.1839},{k:'寧平',lat:20.2506,lon:105.9745},{k:'河內',lat:21.0285,lon:105.8542}];
function placeOf(name){
  var best=null,at=1e9;
  PLACES.forEach(function(p){var i=(name||'').indexOf(p.k);if(i>=0&&i<at){at=i;best=p}});
  return best;
}
function tripYear(){var m=/(20\d\d)/.exec(state.subtitle||'');return m?+m[1]:new Date().getFullYear()}
function iso(md){var m=/^(\d{1,2})\/(\d{1,2})$/.exec(md||'');if(!m)return '';return tripYear()+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2)}
function hanoiNow(){
  var p={};new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
  return {date:p.year+'-'+p.month+'-'+p.day,min:(+p.hour)*60+(+p.minute)};
}
function addDays(d,n){var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function hhmmOf(t){return new Date(t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})}

// WMO weather codes → label + icon kind
function wmo(c){
  if(c===0)return ['晴','sun'];
  if(c===1)return ['大致晴朗','sun'];
  if(c===2)return ['晴時多雲','part'];
  if(c===3)return ['陰天','cloud'];
  if(c===45||c===48)return ['有霧','fog'];
  if(c>=51&&c<=57)return ['毛毛雨','rain'];
  if(c===61||c===80)return [c===80?'短暫陣雨':'小雨','rain'];
  if(c===63||c===81)return [c===81?'陣雨':'中雨','rain'];
  if(c===65||c===66||c===67||c===82)return ['大雨','heavy'];
  if(c>=71&&c<=77||c===85||c===86)return ['降雪','cloud'];
  if(c>=95)return ['雷雨','storm'];
  return ['—','cloud'];
}
var SVG='<svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">';
var SUN='<circle cx="24" cy="24" r="8" fill="var(--ochre)"/><g stroke="var(--ochre)" stroke-width="3"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></g>';
var CLOUD=function(y,fill){return '<path d="M14 '+(34+y)+'h21a7 7 0 0 0 0-14 10 10 0 0 0-19-2A8 8 0 0 0 14 '+(34+y)+'z" fill="'+(fill||'var(--soft)')+'" stroke="var(--muted)" stroke-width="2.5"/>'};
var DROPS=function(n){var s='<g stroke="var(--rain)" stroke-width="3">';for(var i=0;i<n;i++)s+='<path d="M'+(17+i*7)+' 38l-2 6"/>';return s+'</g>'};
function icon(kind){
  var b={
    sun:SUN,
    part:'<g transform="translate(-6 -6) scale(.8)">'+SUN+'</g>'+CLOUD(4),
    cloud:CLOUD(0,'var(--line)'),
    fog:CLOUD(-6)+'<g stroke="var(--muted)" stroke-width="3"><path d="M10 38h28M14 44h20"/></g>',
    rain:CLOUD(-4)+DROPS(3),
    heavy:CLOUD(-4,'var(--line)')+DROPS(4),
    storm:CLOUD(-4,'var(--line)')+'<path d="M25 30l-5 8h6l-4 8" stroke="var(--ochre)" stroke-width="3"/>'
  }[kind]||CLOUD(0);
  return SVG+b+'</svg>';
}

function loadWeather(){
  var today=hanoiNow().date,want={};
  state.days.forEach(function(d){var p=placeOf(d.weather&&d.weather.place),i=iso(d.date);if(p&&i)(want[p.k]=want[p.k]||{p:p,dates:[]}).dates.push(i)});
  return Promise.all(Object.keys(want).map(function(k){
    var ds=want[k].dates.sort(),p=want[k].p;
    // Forecast reaches ~16 days ahead; skip days outside that window
    var start=ds[0]<addDays(today,-60)?addDays(today,-60):ds[0],end=ds[ds.length-1]>addDays(today,15)?addDays(today,15):ds[ds.length-1];
    if(start>end)return null;
    var u='https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,wind_speed_10m_max,sunset'+
      '&hourly=temperature_2m,precipitation_probability,weather_code&timezone='+encodeURIComponent(TZ)+'&start_date='+start+'&end_date='+end;
    return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      var daily={},hourly={},D=j.daily,H=j.hourly;
      D.time.forEach(function(t,i){daily[t]={code:D.weather_code[i],hi:Math.round(D.temperature_2m_max[i]),lo:Math.round(D.temperature_2m_min[i]),
        pop:D.precipitation_probability_max[i],uv:D.uv_index_max[i],wind:Math.round(D.wind_speed_10m_max[i]),sunset:(D.sunset[i]||'').slice(11,16)}});
      H.time.forEach(function(t,i){var h=+t.slice(11,13);if(h>=6&&h<=21&&h%3===0)(hourly[t.slice(0,10)]=hourly[t.slice(0,10)]||[]).push({h:t.slice(11,16),t:Math.round(H.temperature_2m[i]),p:H.precipitation_probability[i],c:H.weather_code[i]})});
      live.wx[k]={daily:daily,hourly:hourly,at:Date.now()};
    }).catch(function(){});
  })).then(saveLive);
}
function loadRate(){
  return fetch('https://open.er-api.com/v6/latest/TWD').then(function(r){return r.json()}).then(function(j){
    if(j&&j.rates&&j.rates.VND){live.rate=j.rates.VND;live.rateAt=Date.now();saveLive()}
  }).catch(function(){});
}
function loadFlights(){return fetch('flight.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j){live.fl=j;try{localStorage.setItem(LIVE,JSON.stringify(live))}catch(e){}}}).catch(function(){})}
setInterval(function(){if(!document.hidden&&!editing)loadFlights().then(function(){var y=window.scrollY;render();window.scrollTo(0,y)})},180000);
function loadLive(){return Promise.all([loadWeather(),loadRate(),loadFlights()]).then(function(){var y=window.scrollY;render();window.scrollTo(0,y)})}

function weatherCard(d){
  var w=d.weather||{},p=placeOf(w.place),k=p&&live.wx[p.k],x=k&&k.daily[iso(d.date)],h='';
  if(x){
    var L=wmo(x.code),hrs=(k.hourly[iso(d.date)]||[]);
    h+='<div class="wx"><div class="wx-top"><div class="wx-ic">'+icon(L[1])+'</div><div class="wx-main"><div class="wx-place">'+esc(w.place)+' · '+L[0]+'</div>';
    h+='<div class="wx-t">'+x.hi+'°<small> / '+x.lo+'°C</small></div></div><div class="wx-chips">';
    h+='<span class="chip rain">降雨 <b>'+(x.pop==null?'—':x.pop+'%')+'</b></span>';
    if(x.uv!=null){var uv=Math.round(x.uv);h+='<span class="chip">UV '+uv+(uv>=8?' 很強':uv>=6?' 強':'')+'</span>'}
    h+='<span class="chip">風 '+x.wind+' km/h</span>';
    if(x.sunset)h+='<span class="chip">日落 '+x.sunset+'</span>';
    h+='</div></div>';
    if(hrs.length)h+='<div class="wx-hours">'+hrs.map(function(r){return '<div><span>'+r.h.slice(0,2)+'時</span>'+icon(wmo(r.c)[1])+'<b>'+r.t+'°</b><span class="p">'+(r.p==null?'':r.p+'%')+'</span></div>'}).join('')+'</div>';
    if(w.wear)h+='<p class="wx-wear">👕 '+esc(w.wear)+'</p>';
    h+='<div class="wx-foot"><span>即時預報 · Open-Meteo</span><span>更新 '+hhmmOf(k.at)+'</span></div></div>';
  }else if(w.hi||w.lo||w.wear){
    var rain=Math.max(0,Math.min(100,parseInt(w.rain,10)||0));
    h+='<div class="wx static"><div class="wx-top"><div class="wx-main"><div class="wx-place">'+esc(w.place)+'</div>';
    if(w.hi||w.lo)h+='<div class="wx-t">'+esc(w.hi)+'°<small> / '+esc(w.lo)+'°C</small></div>';
    h+='</div><div class="wx-chips">'+(w.rain!==undefined&&w.rain!==''?'<span class="chip rain">降雨 <b>'+rain+'%</b></span>':'')+'</div></div>';
    if(w.wear)h+='<p class="wx-wear">👕 '+esc(w.wear)+'</p>';
    h+='<div class="wx-foot"><span>試算表預估；出發前 16 天內會自動換成即時預報</span></div></div>';
  }
  return h;
}

function sos(s){

// Currency converter
function rate(){return live.rate||800}
function money(){
  var h='<section class="block" id="fx"><div class="wrap"><h2>匯率換算</h2>';
  h+='<p class="progress">1 台幣 ≈ '+Math.round(rate()).toLocaleString()+' 越南盾'+(live.rate?'（'+new Date(live.rateAt).toLocaleDateString('zh-TW')+' 即時匯率）':'（約略匯率，連上網路後更新）')+'</p>';
  h+='<div class="fx"><label>越南盾 VND<input inputmode="decimal" data-fx="vnd" placeholder="例如 50000 或 50k"></label><span class="fx-eq">=</span><label>台幣 TWD<input inputmode="decimal" data-fx="twd" placeholder="0"></label></div>';
  h+='<div class="fx-quick">'+[10000,50000,100000,200000,500000].map(function(v){return '<button class="mini" data-fxq="'+v+'">'+(v/1000)+'k</button>'}).join('')+'</div>';
  return h+'</div></section>';

function num(v){v=String(v).trim().toLowerCase().replace(/,/g,'');var k=/k$/.test(v);v=parseFloat(v);return isNaN(v)?null:(k?v*1000:v)}
document.addEventListener('input',function(e){
  var el=e.target,side=el.dataset&&el.dataset.fx;if(!side)return;
  var other=document.querySelector('[data-fx="'+(side==='vnd'?'twd':'vnd')+'"]'),v=num(el.value);
  other.value=v==null?'':(side==='vnd'?(v/rate()).toFixed(v/rate()<100?1:0):Math.round(v*rate()).toLocaleString());
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-fxq]');if(!b)return;
  var a=document.querySelector('[data-fx="vnd"]');a.value=(+b.dataset.fxq).toLocaleString();a.dispatchEvent(new Event('input',{bubbles:true}));
});

// Today + next stop (Hanoi time)
function todayId(){var t=hanoiNow().date,id='';state.days.forEach(function(d){if(iso(d.date)===t)id=d.id});return id}
function nextIndex(d){
  if(d.id!==todayId())return -1;
  var now=hanoiNow().min,idx=-1;
  (d.items||[]).some(function(it,j){var m=/(\d{1,2}):(\d{2})/.exec(it.t||'');if(m&&(+m[1])*60+(+m[2])>=now){idx=j;return true}});
  return idx;
}

}

function murl(q){return /^https?:\/\//.test(q)?q:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
var PIN='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

// Flights: parsed from the sheet's 班機與時差 text, e.g. "去程 CI791 10/29 08:15 桃園 → 10:35 河內"
function flightsOf(s){
  var re=/(去程|回程)?\s*([A-Z0-9]{2})\s?(\d{1,4})\s+(\d{1,2}\/\d{1,2})\s+(\d{1,2}:\d{2})\s*([^\s→｜|]+)\s*→\s*(\d{1,2}:\d{2})\s*([^\s｜|]+)/g,m,out=[];
  while((m=re.exec(s.flights||'')))out.push({leg:m[1]||'',no:m[2]+m[3],date:m[4],dep:m[5],from:m[6],arr:m[7],to:m[8]});
  return out;
}
function flightCard(d){
  var fs=flightsOf(state).filter(function(f){return f.date===d.date});
  return fs.map(function(f){
    var q=encodeURIComponent(f.no);
    var h='<div class="fl"><div class="fl-top"><span class="fl-no">'+esc(f.no)+'</span><span class="chip">'+esc(f.leg||'班機')+' '+esc(f.date)+'</span></div>';
    h+='<div class="fl-route"><div><b>'+esc(f.dep)+'</b><small>'+esc(f.from)+'</small></div><div class="line" aria-hidden="true"></div><div style="text-align:right"><b>'+esc(f.arr)+'</b><small>'+esc(f.to)+'</small></div></div>';
    var nt=state.flightNote||'',named=flightsOf(state).some(function(g){return nt.indexOf(g.no)>=0});
    if(nt&&(!named||nt.indexOf(f.no)>=0))h+='<p class="fl-note">'+esc(state.flightNote)+'</p>';
    var lf=live.fl&&(live.fl.flights||[]).filter(function(x){return x.no===f.no&&x.date.slice(5).replace(/^0/,'').replace('/0','/')===f.date})[0];
    if(lf){
      var late=lf.est!==lf.sched||lf.estDate!==lf.date;
      h+='<div class="fl-live"><span class="fl-st'+(/延|取消/.test(lf.status)?' bad':'')+'">'+esc(lf.status)+'</span>'
        +'<span>'+(lf.dir==='dep'?'桃園起飛':'抵達桃園')+' <b>'+esc(lf.est)+'</b>'+(late?' <s>'+esc(lf.sched)+'</s>':'')+'</span>'
        +(lf.gate?'<span>第 '+esc(lf.terminal)+' 航廈 · 登機門 '+esc(lf.gate)+'</span>':'')+'</div>'
        +'<p class="fl-foot">桃園機場即時資料（台灣時間），'+new Date(live.fl.updated).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})+' 更新，約每 10 分鐘一次</p>';
    }
    h+='<div class="fl-links"><a href="https://www.google.com/search?q='+q+'+flight+status" target="_blank" rel="noopener">Google 航班狀態（含河內端）</a></div>';
    return h+'<p class="fl-foot">上面的大字是表定時間（當地時間）。</p></div>';
  }).join('');
}
function viewDay(d){

  h+='<h2>'+esc(d.title)+(today?'<span class="today-tag">今天</span>':'')+'</h2>'+(d.summary?'<p class="sum">'+esc(d.summary)+'</p>':'');
  h+=flightCard(d);

  h+='</div></div><ol class="tl">';
  (d.items||[]).forEach(function(it,j){

    if(it.maps&&it.maps.length)h+='<div class="maps">'+it.maps.map(function(m){return mapLink(m.l,m.q)}).join('')+'</div>';

    h+='</div></li>';
  });

}

  h+='<div class="row r4"><div><label>地點</label>'+inp(p+'weather.place',w.place)+'</div><div><label>高溫 °C</label>'+inp(p+'weather.hi',w.hi)+'</div><div><label>低溫 °C</label>'+inp(p+'weather.lo',w.lo)+'</div><div><label>降雨 %</label>'+inp(p+'weather.rain',w.rain)+'</div></div>';
  h+='<div class="row"><label>穿著建議</label>'+inp(p+'weather.wear',w.wear)+'</div>';
  h+='<div class="row r2"><div><label>住宿名稱</label>'+inp(p+'stay',d.stay)+'</div><div><label>住宿地圖搜尋字</label>'+inp(p+'stayQ',d.stayQ,'Hotel name Hanoi')+'</div></div>';
  (d.items||[]).forEach(function(it,j){
    var q=p+'items.'+j+'.';
    h+='<div class="item"><div class="item-top">'+inp(q+'t',it.t,'時間')+inp(q+'title',it.title,'行程')+'</div>';
    h+='<div class="row">'+inp(q+'note',it.note,'準備 / 注意')+'</div>';
    (it.maps||[]).forEach(function(m,k){
      h+='<div class="maprow">'+inp(q+'maps.'+k+'.l',m.l,'地圖名稱')+inp(q+'maps.'+k+'.q',m.q,'Google Maps 搜尋字')+'<button class="mini del" data-act="del" data-path="'+q+'maps.'+k+'" aria-label="刪除這個地圖">刪除</button></div>';
    });
    h+='<div class="acts"><button class="mini" data-act="addmap" data-path="'+q+'maps">新增地圖</button><button class="mini" data-act="up" data-path="'+p+'items.'+j+'">上移</button><button class="mini" data-act="down" data-path="'+p+'items.'+j+'">下移</button><button class="mini del" data-act="del" data-path="'+p+'items.'+j+'">刪除這項</button></div></div>';
  });
  h+='<div class="acts"><button class="mini" data-act="additem" data-path="'+p+'items">新增行程</button><button class="mini del" data-act="del" data-path="days.'+i+'">刪除這一天</button></div>';
  return h+'</section>';
}
// Checklist ticks are per phone, keyed by item text; the sheet's 已準備 column is the default
var TICKS='hanoi-trip-ticks-v1',ticks={};
try{ticks=JSON.parse(localStorage.getItem(TICKS)||'{}')||{}}catch(e){}
function ticked(x){return x.text in ticks?ticks[x.text]:!!x.done}
function prepCount(s){var all=0,done=0;s.packing.forEach(function(g){g.items.forEach(function(x){all++;if(ticked(x))done++})});return '已準備 '+done+' / '+all+'（勾選只記在這支手機）'}
function packing(s,ed){
  var h='<section class="block'+(ed?' ed':'')+'" id="prep"><div class="wrap"><h2>出發前準備</h2><p class="progress">'+prepCount(s)+'</p><div class="groups">';
  s.packing.forEach(function(g,gi){
    h+='<div class="group">'+(ed?inp('packing.'+gi+'.group',g.group):'<h3>'+esc(g.group)+'</h3>');
    g.items.forEach(function(x,xi){
      var path='packing.'+gi+'.items.'+xi;
      if(ed)h+='<div class="chk"><input type="checkbox" data-check="'+path+'"'+(x.done?' checked':'')+' aria-label="已準備">'+inp(path+'.text',x.text)+'<button class="mini del" data-act="del" data-path="'+path+'">刪除</button></div>';
      else h+='<label class="check'+(ticked(x)?' done':'')+'"><input type="checkbox" data-check="'+path+'"'+(ticked(x)?' checked':'')+'><span>'+esc(x.text)+'</span></label>';
    });
    if(ed)h+='<div class="acts"><button class="mini" data-act="addcheck" data-path="packing.'+gi+'.items">新增項目</button></div>';
    h+='</div>';
  });
  if(!ed&&Object.keys(ticks).length)h+='<div class="acts"><button class="mini" data-resetticks>清除我的勾選</button></div>';
  return h+'</div></div></section>';
}
function tips(s,ed){
  var h='<section class="block'+(ed?' ed':'')+'" id="tips"><div class="wrap"><h2>實用小提醒</h2>';
  if(ed){s.tips.forEach(function(t,i){h+='<div class="chk" style="grid-template-columns:1fr auto">'+inp('tips.'+i,t)+'<button class="mini del" data-act="del" data-path="tips.'+i+'">刪除</button></div>'});h+='<div class="acts"><button class="mini" data-act="addtip" data-path="tips">新增提醒</button></div>';}
  else h+='<ul class="tips">'+s.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
  return h+'</div></section>';
}
function render(){
  var s=editing?draft:state,h='';
  h+='<header class="hero'+(editing?' ed':'')+'"><div class="wrap"><div>';
  if(editing)h+='<label>標題</label>'+inp('title',s.title)+'<label>日期</label>'+inp('subtitle',s.subtitle)+'<label>班機與時差</label>'+ta('flights',s.flights);
  else h+='<h1>'+esc(s.title)+'</h1><p class="sub">'+esc(s.subtitle)+'</p><p class="flights">'+esc(s.flights)+'</p>';
  h+='</div><div class="shutters" aria-hidden="true"><span class="shutter"></span><span class="shutter"></span></div></div></header>';
  h+='<nav class="nav" aria-label="日期"><div class="wrap">'+s.days.map(function(d){return '<a href="#'+esc(d.id)+'"><b>'+esc(d.date)+'</b> '+esc(d.dow)+'</a>'}).join('')+'<a href="#sos">緊急電話</a><a href="#fx">匯率</a><a href="#prep">準備清單</a><a href="#tips">小提醒</a></div></nav>';
  h+='<main><div class="wrap">';
  if(status)h+='<p class="notice">'+esc(status)+'</p>';
  h+=s.days.map(function(d,i){return editing?editDay(d,i):viewDay(d)}).join('');
  if(editing)h+='<div class="acts" style="margin-top:14px"><button class="mini" data-act="addday" data-path="days">新增一天</button></div>';
  h+='</div>'+sos(s)+money()+packing(s,editing)+tips(s,editing)+'</main>';
  h+='<footer><div class="wrap">行程資料來自 Google 試算表，改完重新整理這頁就會更新；準備清單的勾選記在各自的手機裡。天氣在出發前 16 天內會自動換成 Open-Meteo 即時預報，匯率來自 open.er-api.com，沒網路時顯示上次讀到的資料。地圖連結會開啟 Google Maps 搜尋。</div></footer>';
  h+='<div class="bar"><a class="btn sos-btn" href="#sos">☎ 緊急</a>'+(SHEET_URL?'<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(SHEET_URL)+'">編輯行程（試算表）</a>':'')+'</div><div class="toast" role="status" aria-live="polite"></div>';
  document.getElementById('root').innerHTML=h;
}
var toastT;
function toast(m){var t=document.querySelector('.toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}
function getAt(o,path){return path.split('.').reduce(function(a,k){return a==null?a:a[k]},o)}
function parentOf(o,path){var ks=path.split('.'),last=ks.pop();return [ks.length?getAt(o,ks.join('.')):o,last]}

function buildHTML(s){
  var css=document.getElementById('app-style').textContent;
  var js=document.getElementById('app-script').textContent;
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  var head='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+esc(s.title)+' 旅遊行程</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">';
  return '<!doctype html>\n<html lang="zh-Hant">\n<head>\n'+head+'\n<style id="app-style">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="trip-data">'+json+'<\/script>\n<script id="app-script">'+js+'<\/script>\n</body>\n</html>';
}
var LOCKED=['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'];
function saveLocal(next,msg){
  try{localStorage.setItem(LS,JSON.stringify(next));localOnly=true;render();toast(msg||'已存在這台裝置的瀏覽器')}
  catch(e){render();toast('這個瀏覽器不允許儲存，修改只在這次開啟有效')}
}
function persist(next){
  next.updated=Date.now();state=next;
  return artP.then(function(a){
    if(!a||remoteOK===false){saveLocal(next);return}
    try{sessionStorage.setItem('trip-scroll',String(window.scrollY))}catch(e){}
    toast('儲存中…');
    return a.publish(buildHTML(next)).then(function(){
      try{localStorage.removeItem(LS)}catch(e){}
      localOnly=false;render();toast('已儲存');
    },function(err){
      var c=err&&err.code;
      if(c==='conflict'){toast('有人剛更新了行程，正在載入最新版本');return}
      if(LOCKED.indexOf(c)>=0){remoteOK=false;saveLocal(next,'你沒有這份網頁的編輯權限，已改存在這台裝置');return}
      saveLocal(next,'儲存失敗，已先存在這台裝置');
    });
  });
}
function blankItem(){return {t:'',title:'新行程',maps:[],note:''}}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,path=b.dataset.path;
  if(act==='edit'){draft=JSON.parse(JSON.stringify(state));editing=true;render();return}
  if(act==='cancel'){editing=false;draft=null;render();return}
  if(act==='save'){var n=draft;editing=false;draft=null;persist(n);return}
  var arr=getAt(draft,path);
  if(act==='addmap'){arr.push({l:'',q:''})}
  else if(act==='additem'){arr.push(blankItem())}
  else if(act==='addcheck'){arr.push({text:'',done:false})}
  else if(act==='addtip'){arr.push('')}
  else if(act==='addday'){arr.push({id:'d'+Date.now().toString(36),date:'',dow:'',title:'新的一天',summary:'',stay:'',stayQ:'',weather:{place:'',hi:'',lo:'',rain:'',wear:''},items:[blankItem()]})}
  else{
    var po=parentOf(draft,path),list=po[0],i=+po[1];
    if(act==='del'){if(path.indexOf('days.')===0&&path.split('.').length===2&&!confirm('確定刪除這一天？'))return;list.splice(i,1)}
    if(act==='up'&&i>0){list.splice(i-1,0,list.splice(i,1)[0])}
    if(act==='down'&&i<list.length-1){list.splice(i+1,0,list.splice(i,1)[0])}
  }
  var y=window.scrollY;render();window.scrollTo(0,y);
});
document.addEventListener('input',function(e){
  var el=e.target;if(!editing||!el.dataset.path)return;
  var po=parentOf(draft,el.dataset.path);po[0][po[1]]=el.value;
});
document.addEventListener('change',function(e){
  var el=e.target;if(!el.dataset.check)return;
  var obj=getAt(editing?draft:state,el.dataset.check);
  if(editing){obj.done=el.checked;return}
  ticks[obj.text]=el.checked;
  try{localStorage.setItem(TICKS,JSON.stringify(ticks))}catch(e){}
  var lab=el.closest('.check');if(lab)lab.classList.toggle('done',el.checked);
  var pr=document.querySelector('#prep .progress');if(pr)pr.textContent=prepCount(state);
});
document.addEventListener('click',function(e){
  if(!e.target.closest('[data-resetticks]')||!confirm('清除這支手機上的所有勾選？'))return;
  ticks={};try{localStorage.removeItem(TICKS)}catch(e){}
  var y=window.scrollY;render();window.scrollTo(0,y);
});
render();loadSheet().then(loadLive);
var sy=null;try{sy=sessionStorage.getItem('trip-scroll');sessionStorage.removeItem('trip-scroll')}catch(e){}
if(sy){window.scrollTo(0,+sy)}
else if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
else{var td=document.querySelector('.day.today');if(td)td.scrollIntoView()}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!editing){var y=window.scrollY;render();window.scrollTo(0,y)}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
